name: Publish Preview NuGet

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  event_file:
    # Consumed by the Test Results workflow (test-results.yml) to publish results on the commit.
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}

  tests:
    # Same sharded jobs as PR CI — running the whole solution's tests on one runner stacked all
    # provider containers at once and made KurrentDB container startup (and the tests) flaky.
    name: Tests
    uses: ./.github/workflows/tests.yml

  nuget:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      id-token: write
      contents: read
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v7
        with:
          # MinVer derives the package version from Git tags, so the full history is needed
          fetch-depth: 0
      -
        name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      -
        name: NuGet trusted publishing login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      -
        name: Create and push NuGet package
        run: |
          dotnet pack -c Release -o nuget -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet nuget push nuget/**/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
